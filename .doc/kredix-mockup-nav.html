<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kredix — Home + Nav moderno</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css"></script>
<style>
  body { font-family:'Inter',sans-serif; background:#EDEFF5; }
  .card { box-shadow: 0 10px 28px rgba(30,41,59,0.10), 0 2px 8px rgba(30,41,59,0.05); }
  .nav-float { box-shadow: 0 12px 32px rgba(30,41,59,0.14), 0 4px 10px rgba(30,41,59,0.06); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center py-10">

<div class="w-[390px] h-[750px] rounded-[32px] card bg-[#EDEFF5] p-4 pb-2 relative overflow-hidden">

  <div class="flex items-center justify-between px-1 pb-4">
    <div>
      <p class="text-xs text-slate-400">Buenas tardes</p>
      <p class="text-[18px] font-semibold text-slate-800">Wilmer</p>
    </div>
    <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-semibold card">W</div>
  </div>

  <div class="flex items-center gap-2 bg-white rounded-2xl px-4 py-3 mb-5 card">
    <i class="ti ti-search text-slate-400"></i>
    <input placeholder="Buscar cliente" class="bg-transparent outline-none text-sm w-full placeholder:text-slate-400"/>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-6">
    <div class="rounded-2xl bg-white card p-4">
      <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center mb-3">
        <i class="ti ti-alert-triangle text-rose-500 text-lg"></i>
      </div>
      <p class="text-[11px] text-slate-400 mb-0.5">En calle</p>
      <p class="text-xl font-bold text-slate-800">$217.592</p>
    </div>
    <div class="rounded-2xl bg-white card p-4">
      <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center mb-3">
        <i class="ti ti-cash text-emerald-500 text-lg"></i>
      </div>
      <p class="text-[11px] text-slate-400 mb-0.5">Cobrado hoy</p>
      <p class="text-xl font-bold text-slate-800">$0.00</p>
    </div>
  </div>

  <p class="text-xs font-medium text-slate-400 mb-3 px-1">Acción rápida</p>
  <div class="grid grid-cols-4 gap-3 mb-6">
    <button class="flex flex-col items-center gap-2">
      <div class="w-14 h-14 rounded-2xl bg-indigo-50 flex items-center justify-center card"><i class="ti ti-user-plus text-indigo-500 text-xl"></i></div>
      <span class="text-[11px] text-slate-500 font-medium">Cliente</span>
    </button>
    <button class="flex flex-col items-center gap-2">
      <div class="w-14 h-14 rounded-2xl bg-emerald-50 flex items-center justify-center card"><i class="ti ti-arrow-down text-emerald-500 text-xl"></i></div>
      <span class="text-[11px] text-slate-500 font-medium">Abono</span>
    </button>
    <button class="flex flex-col items-center gap-2">
      <div class="w-14 h-14 rounded-2xl bg-orange-50 flex items-center justify-center card"><i class="ti ti-shopping-cart text-orange-500 text-xl"></i></div>
      <span class="text-[11px] text-slate-500 font-medium">Cargo</span>
    </button>
    <button class="flex flex-col items-center gap-2">
      <div class="w-14 h-14 rounded-2xl bg-sky-50 flex items-center justify-center card"><i class="ti ti-note text-sky-500 text-xl"></i></div>
      <span class="text-[11px] text-slate-500 font-medium">Gestión</span>
    </button>
  </div>

  <div class="flex items-center justify-between mb-3 px-1">
    <p class="text-xs font-medium text-slate-400">Cartera con mora</p>
    <span class="text-xs font-medium text-indigo-500">Ver todo</span>
  </div>
  <div class="flex flex-col gap-2.5">
    <div class="rounded-2xl bg-white card px-4 py-3 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center"><i class="ti ti-user text-rose-500"></i></div>
      <div class="flex-1"><p class="text-sm font-medium text-slate-800">Maracucho</p><p class="text-[11px] text-slate-400">48 días sin abonar</p></div>
      <p class="text-sm font-semibold text-rose-500">$2.465</p>
    </div>
  </div>

  <!-- NAV FLOTANTE MODERNO — separado del borde, blanco, pildora activa -->
  <div class="absolute bottom-4 left-4 right-4 bg-white rounded-[22px] nav-float px-2 py-2 flex items-center justify-between">
    <button class="flex items-center gap-1.5 bg-indigo-50 text-indigo-600 rounded-full px-4 py-2.5">
      <i class="ti ti-home text-lg"></i>
      <span class="text-xs font-semibold">Inicio</span>
    </button>
    <button class="flex flex-col items-center justify-center w-11 h-11 text-slate-400">
      <i class="ti ti-users text-xl"></i>
    </button>
    <button class="flex flex-col items-center justify-center w-11 h-11 text-slate-400">
      <i class="ti ti-wallet text-xl"></i>
    </button>
    <button class="flex flex-col items-center justify-center w-11 h-11 text-slate-400">
      <i class="ti ti-bell text-xl"></i>
    </button>
    <button class="flex flex-col items-center justify-center w-11 h-11 text-slate-400">
      <i class="ti ti-dots text-xl"></i>
    </button>
  </div>
</div>

</body>
</html>
